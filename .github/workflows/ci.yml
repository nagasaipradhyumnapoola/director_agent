name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e . --no-deps
          python -m pip install pytest "mcp>=1.0" python-docx
      - name: Doctor (help)
        run: python -m director --version
      - name: Offline tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t director:ci .
      - name: CLI version
        run: docker run --rm director:ci --version
      - name: Project init/status in a mounted volume
        run: |
          mkdir -p project
          chmod -R 777 project
          docker run --rm -v "$PWD/project:/project" director:ci \
            init --root /project --name ci --domain general
          docker run --rm -v "$PWD/project:/project" director:ci \
            status --root /project --json
