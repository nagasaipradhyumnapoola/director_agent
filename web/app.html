<!doctype html>

      <nav class="side-nav" aria-label="Views">
        <a href="#overview" data-view-link="overview">

        <a href="#selfdev" data-view-link="selfdev">

      <div class="side-section">Workspace</div>
      <nav class="side-nav" aria-label="Workspace links">
        <a href="https://github.com/nagasaipradhyumnapoola/director_agent/blob/main/docs/build/BENCHMARKS.md" rel="noreferrer">

        <a href="https://github.com/nagasaipradhyumnapoola/director_agent/blob/main/README.md" rel="noreferrer">

          Landing page
        </a>

      <div class="side-footer">

    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <div class="crumbs" aria-label="Breadcrumb">
          <span>director-agent</span><span class="sep">/</span><span id="crumb">overview</span>
        </div>
        <div class="topbar-actions">
          <button class="search-trigger" type="button" id="open-command" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            Jump to
            <kbd>Ctrl K</kbd>
          </button>
          <span class="status-pill"><span class="status-dot" aria-hidden="true"></span>Worker running</span>
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch color theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
          </button>
        </div>
      </header>

      <div class="content" id="view" aria-live="polite"></div>
      <noscript><p class="content">This console needs JavaScript. The CLI and MCP server do not.</p></noscript>
    </main>

    <div class="commandk-box">
      <h2 id="commandk-title" class="mono" style="padding:.8rem 1rem 0;color:var(--faint);font-size:.6rem">Jump to</h2>
      <input id="commandk-input" type="search" placeholder="Overview, evidence, benchmarks…" autocomplete="off" aria-label="Filter destinations">
      <ul class="commandk-list" id="commandk-list"></ul>
    </div>
  </div>

  <script>

    window.DIRECTOR_FALLBACK = {
      project: { name: "director-agent", release: "v1.0.0-local-supervised", domain: "general", commit: "8f5b1de" },
      worker: { status: "running", heartbeat_age_seconds: 2 },
      kpis: [
        { label: "Acceptance", value: "100%", delta: "8/8 criteria current", tone: "up" },
        { label: "Offline tests", value: "85", delta: "passed in 117.08s", tone: "up" },
