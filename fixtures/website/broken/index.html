<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Demo Shop</h1>
      <nav>
        <a href="#catalog">Catalog</a>
        <a href="#cart">Cart</a>
      </nav>
    </header>
    <main id="main">
      <form id="search-form">
        <input id="search" name="q" type="search" placeholder="Search">
        <button id="search-button" type="button">Search</button>
      </form>
      <section id="catalog">
        <h2>Catalog</h2>
        <ul id="results">
          <li class="product">
            <img src="https://example.com/tracker.png" width="48" height="48">
            <span>Blue mug</span>
            <span>$12</span>
            <div id="add-to-cart">Add to cart</div>
          </li>
        </ul>
      </section>
      <p id="cart">Cart: 0 items</p>
      <div id="checkout">Checkout</div>
      <section id="confirmation" hidden>
        <h2>Order confirmed</h2>
        <p>Thanks for your order.</p>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
